<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="theme-color" content="#7c5cd6">
<title>K_Film</title>
<style>
:root{--bg1:#e9e0ff;--bg2:#c9b6f5;--bg3:#9d82e6;--ink:#2a1f4d;--mut:#6b5f93;--card:rgba(255,255,255,.62);--line:rgba(255,255,255,.7);--ac:#7c5cd6;--ac2:#5b3fb0;--wave:rgba(255,255,255,.75)}
:root[data-t=dark]{--bg1:#2a1d52;--bg2:#1c1338;--bg3:#120b26;--ink:#f3eeff;--mut:#b9abe0;--card:rgba(255,255,255,.09);--line:rgba(255,255,255,.18);--ac:#a58bf5;--ac2:#c9b6f5;--wave:rgba(255,255,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Vazirmatn","Noto Sans KR","Noto Sans Arabic",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
main{flex:1;overflow-y:auto;padding:14px 14px 90px}
h1,h2,h3{margin:0}
h2{font-size:18px;margin:18px 0 10px}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;flex:1}
.logo{width:40px;height:40px;flex:none}
.card,.box{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px}
.box{padding:14px;margin:10px 0}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.pc{width:124px;flex:none;cursor:pointer}
.pc .po{aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:linear-gradient(150deg,var(--ac),var(--bg3));display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 8px 22px rgba(80,50,160,.28)}
.po img{width:100%;height:100%;object-fit:cover;display:block}
.po b{font-size:54px;color:#fff;opacity:.9}
.pc .t{font-size:13px;font-weight:700;margin-top:6px;line-height:1.3}
.pc .s{font-size:11px;color:var(--mut)}
.badge{position:absolute;top:6px;inset-inline-start:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 7px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px}
.grid .pc{width:auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0))}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav button.on{color:var(--ac);font-weight:700}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.5)}
:root[data-t=dark] input,:root[data-t=dark] select,:root[data-t=dark] textarea{background:rgba(255,255,255,.1)}
textarea{min-height:80px;resize:vertical}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;padding:11px 18px;border-radius:13px;font-weight:700}
:root[data-t=dark] .btn{color:#1c1338}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:#c2415d;color:#fff}
.sr{display:flex;gap:8px}
.sr input{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px 0 12px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:13px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.res{display:flex;gap:12px;padding:10px;margin-bottom:10px;align-items:flex-start}
.res .po{width:70px;flex:none;aspect-ratio:2/3;border-radius:10px}
.res .po b{font-size:30px}
.res .i{flex:1;min-width:0}
.res .i b{display:block}
.res small{color:var(--mut);display:block;margin-top:2px}
.err{background:rgba(194,65,93,.15);border:1px solid #c2415d;border-radius:14px;padding:12px;margin:10px 0}
.empty{text-align:center;color:var(--mut);padding:22px 10px}
.bar{height:10px;border-radius:6px;background:rgba(124,92,214,.2);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st .box{margin:0;text-align:center}
.st b{display:block;font-size:26px;color:var(--ac)}
.st span{font-size:12px;color:var(--mut)}
.mod{position:fixed;inset:0;z-index:10;background:rgba(20,10,45,.55);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:linear-gradient(170deg,var(--bg1),var(--bg2));border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0))}
.hd{display:flex;gap:14px}
.hd .po{width:110px;flex:none;aspect-ratio:2/3;border-radius:12px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
.fav{background:none;border:0;font-size:26px;padding:0;color:var(--mut)}
.fav.on{color:#e0457b}
.wel{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
.wel .box{width:100%;max-width:360px;text-align:center;padding:26px 20px}
.wel .logo{width:92px;height:92px;margin-bottom:8px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0));left:50%;transform:translateX(-50%);z-index:30;background:var(--ac2);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;max-width:90%}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0}
.hbar span{width:92px;font-size:12px;color:var(--mut)}
.hbar .bar{flex:1;margin:0}
.hbar em{font-style:normal;font-size:12px;width:24px}
button{touch-action:manipulation}
.btn,.chip,nav button,.fav{transition:transform .08s,opacity .08s}
.btn:active,.chip:active,nav button:active,.fav:active{transform:scale(.93);opacity:.75}
.dmsg{position:sticky;top:0;z-index:3;border-radius:12px;font-weight:700;text-align:center;margin-bottom:8px}
.dmsg:empty{display:none}
.dmsg.ok{background:#2e9e6b;color:#fff;padding:11px}
.dmsg.bad{background:#c2415d;color:#fff;padding:11px}
.ver{text-align:center;font-size:11px;color:var(--mut);margin-top:12px}
</style>
</head>

async function tm(path,params={},lang=S.lang){

async function doSearch(q){

}
async function addItem(type,id){
  const base=(type==="movie"?SR.movie:SR.tv).find(x=>x.id===id);const k=type+"-"+id;
  if(S.lib[k]){toast(t("inlib"));return}
  try{
    const ds=await Promise.all(["fa","en","ko"].map(l=>tm("/"+type+"/"+id,{},l)));
    const tt={};["fa","en","ko"].forEach((l,i)=>{const d=ds[i];tt[l]=(type==="movie"?d.title:d.name)||""});
    const d=ds[1];
    S.lib[k]={k,type,id,t:tt,orig:type==="movie"?d.original_title:d.original_name,year:base.year,poster:d.poster_path||base.poster,ctry:(d.production_countries||[]).map(c=>c.name),eps:type==="tv"?(d.number_of_episodes||0):0,st:"plan",fav:false,rating:null,note:"",ep:0,added:Date.now()};
    save();toast(t("added"));render();
  }catch(e){toast(t("neterr"))}
}
/* ---------- views ---------- */
function sec(h,list,empty){return `<h2>${h}</h2>`+(list.length?`<div class="row">${list.map(card).join("")}</div>`:empty?`<div class="empty">${t("empty")}</div>`:"")}
function vHome(){
  const a=items();
  const cont=a.filter(i=>i.st==="watching").sort((x,y)=>(y.upd||0)-(x.upd||0));
  const rec=a.filter(i=>i.st==="plan").sort(()=>Math.random()-.5).slice(0,12);
  const wm=welcomeMsg(true);
  return `<div class="top">${LOGO}<h1>K_Film</h1><button class="btn ghost" data-a="settings">⚙</button></div><div class="box" style="margin-top:12px">${esc(wm)}</div>`+
   sec(t("cont"),cont,!a.length)+sec(t("recent"),[...a].sort((x,y)=>y.added-x.added).slice(0,12))+sec(t("favorites"),a.filter(i=>i.fav))+sec(t("rec"),rec);
}
function vSearch(){
  let h=`<div class="top">${LOGO}<h1>${t("search")}</h1></div><div class="sr" style="margin-top:12px"><input id="q" type="search" placeholder="${esc(t("ph"))}" value="${esc($("#q")?.value||"")}"><button class="btn" data-a="go">${t("go")}</button></div>`;
  if(busy)h+=`<div class="empty">…</div>`;
  if(sErr)h+=`<div class="err">${esc(sErr)}</div>`;
  if(SR&&!busy){
    const blk=(lab,arr)=>`<h2>${lab}</h2>`+(arr.length?arr.map(x=>{const inl=S.lib[x.k];return `<div class="card res">${poster(x)}<div class="i"><b>${esc(x.title)}</b>${x.orig&&x.orig!==x.title?`<small>${esc(x.orig)}</small>`:""}<small>${t("nm")}: ${esc(x.year||t("unk"))}</small>${x.ctry?.length?`<small>${t("ct")}: ${esc(x.ctry.join("، "))}</small>`:""}${x.type==="tv"&&x.eps?`<small>${x.eps} ${t("ep")}</small>`:""}<div style="margin-top:8px">${inl?`<span class="chip on">${t("inlib")}</span>`:`<button class="btn" data-a="add" data-type="${x.type}" data-id="${x.id}">+ ${t("add")}</button>`}</div></div></div>`}).join(""):`<div class="empty">${t("nores")}</div>`);
    h+=blk(t("movies"),SR.movie)+blk(t("tv"),SR.tv);
  }
  return h;
}
function chips(){return `<div class="chips">`+["all","watching","watched","plan"].map(s=>`<button class="chip ${libF===s?"on":""}" data-a="f" data-s="${s}">${t(s)}</button>`).join("")+`</div>`}
function vLib(){
  let a=items().sort((x,y)=>y.added-x.added);if(libF!=="all")a=a.filter(i=>i.st===libF);
  const mv=a.filter(i=>i.type==="movie"),tv=a.filter(i=>i.type==="tv");
  return `<div class="top">${LOGO}<h1>${t("lib")}</h1></div>${chips()}`+(a.length?(tv.length?`<h2>${t("tv")}</h2><div class="grid">${tv.map(card).join("")}</div>`:"")+(mv.length?`<h2>${t("movies")}</h2><div class="grid">${mv.map(card).join("")}</div>`:""):`<div class="empty">${t("empty")}</div>`);
}
function vFavs(){const a=items().filter(i=>i.fav);return `<div class="top">${LOGO}<h1>${t("favs")}</h1></div>`+(a.length?`<div class="grid" style="margin-top:12px">${a.map(card).join("")}</div>`:`<div class="empty">${t("empty")}</div>`)}
function vStats(){
  const a=items(),w=a.filter(i=>i.st==="watched"),c=s=>a.filter(i=>i.st===s).length;
  const eps=a.filter(i=>i.type==="tv").reduce((n,i)=>n+(i.ep||0),0);
  const r=a.filter(i=>typeof i.rating==="number");const avg=r.length?(r.reduce((n,i)=>n+i.rating,0)/r.length).toFixed(1):"—";
  const cells=[[w.filter(i=>i.type==="movie").length,t("tw")],[w.filter(i=>i.type==="tv").length,t("tvw")],[a.length,t("tt")],[c("watching"),t("watching")],[c("watched"),t("watched")],[c("plan"),t("plan")],[a.filter(i=>i.fav).length,t("favs")],[eps,t("epst")],[avg,t("avg")]];
  const mx=Math.max(1,c("watching"),c("watched"),c("plan"),a.filter(i=>i.fav).length);
  const bars=[["watching",c("watching")],["watched",c("watched")],["plan",c("plan")],["favs",a.filter(i=>i.fav).length]].map(([k,n])=>`<div class="hbar"><span>${t(k)}</span><div class="bar"><i style="width:${n/mx*100}%"></i></div><em>${n}</em></div>`).join("");
  return `<div class="top">${LOGO}<h1>${t("stats")}</h1></div><div class="st" style="margin-top:12px">${cells.map(([n,l])=>`<div class="box"><b>${n}</b><span>${esc(l)}</span></div>`).join("")}</div><div class="box"><h3 style="margin-bottom:6px">${t("byst")}</h3>${bars}</div>`;
}
function vSettings(){
  const sel=(id,v,o)=>`<select id="${id}">${o.map(([k,n])=>`<option value="${k}" ${k===v?"selected":""}>${n}</option>`).join("")}</select>`;
  return `<div class="top"><button class="btn ghost" data-a="back">${S.lang==="fa"?"→":"←"}</button><h1>${t("settings")}</h1></div>
  <div class="box"><label>${t("lang")}</label>${sel("sl",S.lang,[["fa","فارسی"],["en","English"],["ko","한국어"]])}
  <label>${t("theme")}</label>${sel("sth",S.theme,[["auto",t("auto")],["light",t("light")],["dark",t("dark")]])}</div>
  <div class="box"><label>${t("name")}</label><div class="sr"><input id="sn" value="${esc(S.name)}"><button class="btn" data-a="sname">${t("save")}</button></div>
  <label>${t("key")}</label><div class="sr"><input id="sk" type="password" autocomplete="off" value="${esc(S.key)}"><button class="btn" data-a="skey">${t("save")}</button></div><small style="color:var(--mut)">${t("keyh")}</small></div>
  <div class="box"><button class="btn" data-a="exp">${t("exp")}</button> <button class="btn ghost" data-a="imp">${t("imp")}</button><input id="imf" type="file" accept="application/json,.json" hidden></div>
  <div class="box"><h3>${t("acct")}</h3><p style="color:var(--mut);margin:6px 0 0">${t("acctn")}</p></div>
  <div class="box"><h3>${t("about")}</h3><p style="color:var(--mut);margin:6px 0 0">K_Film 1.3 · TMDB</p></div>`;
}
const VIEWS={home:vHome,search:vSearch,lib:vLib,favs:vFavs,stats:vStats,settings:vSettings};
function render(){
  applyTheme();
  const m=$("#main"),sc=m.scrollTop;
  const qv=$("#q")?.value;
  m.innerHTML=VIEWS[tab]();
  if(qv&&$("#q"))$("#q").value=qv;
  $("#nav").innerHTML=TABS.map(k=>`<button class="${tab===k?"on":""}" data-a="tab" data-k="${k}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${t(k)}</button>`).join("");
  m.scrollTop=sc;
}
/* ---------- welcome ---------- */
function isElena(n){const x=n.trim().replace(/\s+/g," ").toLowerCase();return x==="elena"||x==="النا"}
function welcomeMsg(back){const n=S.name;if(isElena(n))return back?"خوش برگشتی ملکه (النا) 👑💜":"خوش اومدی ملکه (النا) 👑💜";return back?`خوش برگشتی، ${n}! 🎬`:`خوش اومدی، ${n}! 🎬`}
function showWelcome(){
  $("#layer").innerHTML=`<div class="wel"><div class="box">${LOGO}<h2 style="margin:8px 0 14px">K_Film</h2>
  <div class="chips" style="justify-content:center">${["fa","en","ko"].map(l=>`<button class="chip ${S.lang===l?"on":""}" data-a="wl" data-l="${l}">${{fa:"فارسی",en:"English",ko:"한국어"}[l]}</button>`).join("")}</div>
  <p style="margin:0 0 10px">${t("nameq")}</p><input id="wn" maxlength="40"><button class="btn" style="margin-top:12px;width:100%" data-a="wstart">${t("start")}</button></div></div>`;
}
/* ---------- details ---------- */
function openDetail(k){
  const it=S.lib[k];if(!it)return;
  const tv=it.type==="tv";const rem=Math.max(0,(it.eps||0)-(it.ep||0));const pct=it.eps?Math.min(100,(it.ep||0)/it.eps*100):0;
  $("#layer").innerHTML=`<div class="mod" data-a="mclose"><div class="sheet" data-k="${esc(k)}"><div id="dmsg" class="dmsg" role="status"></div>
  <div class="hd">${poster(it)}<div style="flex:1;min-width:0"><h2 style="margin:0 0 4px">${esc(title(it))}</h2>
  <small style="color:var(--mut);display:block">${t("orig")}: ${esc(it.orig)}</small><small style="color:var(--mut)">${esc(it.year||"")} ${it.ctry?.length?"· "+esc(it.ctry.join("، ")):""}</small><div style="margin-top:8px"><button class="fav ${it.fav?"on":""}" data-a="fav" aria-label="favorite">${it.fav?"♥":"♡"}</button></div></div></div>
  <label>${t("status")}</label><select id="dst">${["watching","watched","plan","none"].map(s=>`<option value="${s}" ${it.st===s?"selected":""}>${stLabel(s)}</option>`).join("")}</select>
  ${tv?`<label>${t("epw")} (${t("total")}: ${it.eps||"?"})</label><div class="sr"><input id="dep" type="text" inputmode="numeric" autocomplete="off" value="${it.ep||0}"><button class="btn" data-a="dsave">${t("save")}</button></div><div class="bar"><i style="width:${pct}%"></i></div><small style="color:var(--mut)">${it.ep||0} / ${it.eps||"?"} · ${t("rem")}: ${it.eps?rem:"?"}</small>`:""}
  <label>${t("rating")}</label><div class="sr"><input id="drt" type="text" inputmode="decimal" autocomplete="off" value="${it.rating??""}"><button class="btn" data-a="dsave">${t("save")}</button></div>
  <label>${t("notes")}</label><textarea id="dnt">${esc(it.note)}</textarea><button class="btn" style="margin-top:8px" data-a="dsave">${t("save")}</button>
  <div style="display:flex;gap:10px;margin-top:18px"><button class="btn red" data-a="dele">${t("del")}</button><button class="btn ghost" data-a="mclose">${t("close")}</button></div><div class="ver">v1.3</div></div></div>`;bindSheet(k);
}
function upd(k,fn){const it=S.lib[k];if(!it)return;fn(it);it.upd=Date.now();save();render()}
/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;
  const k=el.closest(".sheet")?.dataset.k;
  if(a==="tab"){tab=el.dataset.k;render()}
  else if(a==="settings"){tab="settings";render()}
  else if(a==="back"){tab="home";render()}
  else if(a==="go")doSearch($("#q").value);
  else if(a==="add")addItem(el.dataset.type,+el.dataset.id);
  else if(a==="f"){libF=el.dataset.s;render()}
  else if(a==="open")openDetail(el.dataset.k);
  else if(a==="mclose"){if(el.classList.contains("mod")&&e.target!==el)return;$("#layer").innerHTML="";render()}
  else if(a==="fav"){saveDetail(k,"quiet");upd(k,i=>i.fav=!i.fav);openDetail(k)}
  else if(a==="dsave")doSave(k,0);
  else if(a==="dele"){if(confirm(t("delq"))){delete S.lib[k];save();$("#layer").innerHTML="";render()}}
  else if(a==="sname"){const v=$("#sn").value.trim();if(v){S.name=v;save();toast(t("saved"))}}
  else if(a==="skey"){S.key=$("#sk").value.trim();save();toast(t("saved"))}
  else if(a==="exp")exportData();
  else if(a==="imp")$("#imf").click();
  else if(a==="wl"){S.lang=el.dataset.l;save();applyTheme();showWelcome()}
  else if(a==="wstart"){const v=$("#wn").value.trim();if(!v)return;S.name=v;S.seen=true;save();$("#layer").innerHTML="";const m=welcomeMsg(false);render();toast(m)}
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="sl"){S.lang=e.target.value;save();render()}
  else if(id==="sth"){S.theme=e.target.value;save();render()}
  else if(id==="dst"){const k=e.target.closest(".sheet").dataset.k;saveDetail(k,"quiet");upd(k,i=>i.st=e.target.value);openDetail(k)}
  else if(id==="imf"&&e.target.files[0])importData(e.target.files[0]);
});
function numTxt(v){return String(v??"").trim().replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[٫,،]/g,".")}
/* mode: "input" = live typing, "quiet" = leaving a field / pressing Save, "full" = Save tapped (verify + message + refresh) */
function saveDetail(k,mode){
  const it=S.lib[k];const full=mode==="full";let bad=null;if(!it||!$("#drt")||!$("#dnt")){if(full)msg(t("saveerr"),true);return false}
  let rating=it.rating;const rs=numTxt($("#drt").value);
  if(rs==="")rating=null;else{const n=Number(rs);if(!isFinite(n))bad=t("badr");else rating=Math.min(10,Math.max(0,n))}
  let ep=it.ep||0;const de=$("#dep");
  if(de&&it.type==="tv"){const es=numTxt(de.value);if(es==="")ep=0;else if(/^\d+$/.test(es)){ep=parseInt(es,10);if(it.eps)ep=Math.min(ep,it.eps)}else bad=bad||t("bade")}
  if(bad&&full){msg(bad,true);return false}
  const note=$("#dnt").value;
  it.rating=rating;it.note=note;if(it.type==="tv")it.ep=ep;
  if(mode!=="input"&&it.type==="tv"){if(it.eps&&ep>=it.eps)it.st="watched";else if(ep>0&&it.st==="plan")it.st="watching"}
  it.upd=Date.now();const ok=save();
  if(!full)return ok;
  let v=false;try{const c=JSON.parse(localStorage.getItem(KEY)).lib[k];v=!!c&&c.rating===it.rating&&c.note===note&&(it.type!=="tv"||c.ep===ep)}catch(e){}
  if(!ok||!v){msg(t("saveerr"),true);return false}
  const sc=$(".sheet").scrollTop;render();openDetail(k);const sh=$(".sheet");if(sh)sh.scrollTop=sc;msg(t("saved"));return true;
}
let _mt;
function msg(m,bad){toast(m,bad);const d=$("#dmsg");if(d){d.textContent=m;d.className="dmsg "+(bad?"bad":"ok");clearTimeout(_mt);_mt=setTimeout(()=>{d.textContent="";d.className="dmsg"},bad?4000:2200)}}
function flash(idx,ok){const b=document.querySelectorAll(".sheet [data-a=dsave]")[idx];if(!b)return;const o=b.textContent;b.textContent=ok?"✓":"✗";b.style.background=ok?"#2e9e6b":"#c2415d";b.style.color="#fff";setTimeout(()=>{if(b.isConnected){b.textContent=o;b.style.background="";b.style.color=""}},1400)}
function doSave(k,idx){let ok=false;try{ok=saveDetail(k,"full")}catch(err){msg("Error: "+(err&&err.message||err),true)}flash(idx,ok)}
/* Save buttons get their own listeners every time the sheet is drawn (tap = click or a touch that did not scroll) */
function bindSheet(k){document.querySelectorAll(".sheet [data-a=dsave]").forEach((b,idx)=>{b.type="button";let last=0,y0=0;
  const go=ev=>{ev.preventDefault();ev.stopPropagation();const n=Date.now();if(n-last<400)return;last=n;doSave(k,idx)};
  b.addEventListener("click",go);
  b.addEventListener("touchstart",ev=>{y0=ev.touches[0].clientY},{passive:true});
  b.addEventListener("touchend",ev=>{const dy=Math.abs((ev.changedTouches[0]||{clientY:y0}).clientY-y0);if(dy<10)go(ev)},{passive:false});
})}
addEventListener("error",e=>msg("JS error: "+(e.message||"unknown"),true));
addEventListener("unhandledrejection",e=>msg("Error: "+((e.reason&&e.reason.message)||e.reason),true));
const DF=["drt","dnt","dep"];
document.addEventListener("input",e=>{const sh=e.target.closest?.(".sheet");if(sh&&DF.includes(e.target.id))saveDetail(sh.dataset.k,"input")});
document.addEventListener("focusout",e=>{const sh=e.target.closest?.(".sheet");if(sh&&DF.includes(e.target.id))saveDetail(sh.dataset.k,"quiet")});
document.addEventListener("pointerdown",e=>{const b=e.target.closest?.("[data-a=dsave]");const sh=b&&b.closest(".sheet");if(sh)saveDetail(sh.dataset.k,"quiet")});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){if(e.target.id==="q")doSearch(e.target.value);if(e.target.id==="wn")document.querySelector('[data-a=wstart]').click()}});
/* ---------- backup ---------- */
function exportData(){
  const data={app:"K_Film",version:1,exported:new Date().toISOString(),settings:{name:S.name,lang:S.lang,theme:S.theme},library:S.lib};
  const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="K_Film_backup_"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
}
function validItem(i){return i&&typeof i==="object"&&(i.type==="movie"||i.type==="tv")&&Number.isInteger(i.id)&&i.t&&typeof i.t==="object"&&["watching","watched","plan","none"].includes(i.st)}
function importData(f){
  const rd=new FileReader();
  rd.onload=()=>{try{
    const d=JSON.parse(rd.result);if(d.app!=="K_Film"||!d.library||typeof d.library!=="object")throw 0;
    const ent=Object.values(d.library);if(!ent.every(validItem))throw 0;
    const dup=ent.filter(i=>S.lib[i.type+"-"+i.id]);let over=false;
    if(dup.length)over=confirm(t("ovr"));
    ent.forEach(i=>{const k=i.type+"-"+i.id;if(!S.lib[k]||over){i.k=k;S.lib[k]=i}});
    if(d.settings&&!S.name&&d.settings.name)S.name=String(d.settings.name);
    save();render();toast(t("impok"));
  }catch(e){toast(t("imperr"))}$("#imf").value=""};
  rd.readAsText(f);
}
/* ---------- start ---------- */
applyTheme();render();
if(!S.seen||!S.name)showWelcome();else toast(welcomeMsg(true));
</script>
</body>
</html>
